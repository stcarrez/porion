description = "Porion Automation Build System"
name = "porion"
version = "0.16.0"
authors = ["Stephane.Carrez@gmail.com"]
licenses = "Apache-2.0"
maintainers = ["Stephane.Carrez@gmail.com"]
maintainers-logins = ["stcarrez"]
project-files = ["porion.gpr"]
tags = ["uml", "generator", "database"]
website = "https://gitlab.com/stcarrez/porion"
executables = ["dynamo"]
long-description = """

[![License](http://img.shields.io/badge/license-APACHE2-blue.svg)](LICENSE)
[![Build Status](https://img.shields.io/endpoint?url=https://porion.vacs.fr/porion/api/v1/projects/porion/badges/build.json)](https://porion.vacs.fr/porion/projects/view/porion/summary)
[![Test Status](https://img.shields.io/endpoint?url=https://porion.vacs.fr/porion/api/v1/projects/porion/badges/tests.json)](https://porion.vacs.fr/porion/projects/view/porion/xunits)
[![Coverage](https://img.shields.io/endpoint?url=https://porion.vacs.fr/porion/api/v1/projects/porion/badges/coverage.json)](https://porion.vacs.fr/porion/projects/view/porion/summary)
[![semver](https://img.shields.io/badge/semver-2.0.0-blue.svg?cacheSeconds=2592000)]()

Porion is an automation system that helps automate the building, testing and
deployment of software development projects.

"""

[[depends-on]]
aws = "~24.0"
xmlada = "any"
libgpr = "any"
ansiada = "^1.0.0"
intl = "^1.0.1"
utilada = "*"
utilada_xml = "*"
utilada_aws = "*"
elada = "*"
serverfaces = "*"
ado = "*"
ado_sqlite = "*"
security = "*"
keystoreada = "*"
awa = "*"
openapi = "*"
openapi_server = "*"

[configuration]
disabled = true

# [[actions]]
# type = "post-fetch"
# command = ["sh", "./alire-setup.sh"]

[environment]
PATH.prepend = "${CRATE_ROOT}/bin"
MANPATH.prepend = "${CRATE_ROOT}/man"

[[pins]]
utilada = { path = 'awa/ada-util' }
utilada_xml = { path = 'awa/ada-util/xml' }
utilada_aws = { path = 'awa/ada-util/aws' }
elada = { path = 'awa/ada-el' }
serverfaces = { path = 'awa/ada-asf' }
ado = { path = 'awa/ada-ado' }
ado_all = { path = 'awa/ada-ado/drivers' }
ado_sqlite = { path = 'awa/ada-ado/sqlite' }
security = { path = 'awa/ada-security' }
keystoreada = { path = 'awa/ada-keystore' }
awa = { path = 'awa' }
openapi = { path = 'awa/openapi-ada' }
openapi_server = { path = 'awa/openapi-ada/server' }
