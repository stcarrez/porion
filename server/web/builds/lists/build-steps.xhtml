<ui:composition
  xmlns:awa="http://code.google.com/p/ada-awa/jsf"
  xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:f="http://java.sun.com/jsf/core"
  xmlns:c="http://java.sun.com/jstl/core"
  xmlns:u="http://code.google.com/p/ada-asf/util"
  xmlns:w="http://code.google.com/p/ada-asf/widget"
  xmlns:h="http://java.sun.com/jsf/html">
  <div class='dashboard-list'>
    <h:list var="step" value="#{build.build_steps}">
      <div class='project-page-grid'>
        <div>
          #{step.number}
        </div>
        <div>
          #{step.builder}
        </div>
        <div>
          #{step.kind}
        </div>
        <div>
          #{step.status}
        </div>
        <div>
          #{step.user_time}
        </div>
        <div>
          #{step.sys_time}
        </div>
        <div>
          #{step.step_duration}
        </div>
      </div>
    </h:list>
  </div>
</ui:composition>
