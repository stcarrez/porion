<ui:composition
        xmlns:awa="http://code.google.com/p/ada-awa/jsf"
        xmlns:ui="http://java.sun.com/jsf/facelets"
        xmlns:f="http://java.sun.com/jsf/core"
        xmlns:c="http://java.sun.com/jstl/core"
        xmlns:u="http://code.google.com/p/ada-asf/util"
        xmlns:h="http://java.sun.com/jsf/html">
    <h:panelGroup rendered="#{projectList.count == 0}">
        #{porionMsg.porion_no_project_message}
    </h:panelGroup>
    <h:list var="project" value="#{projectList.projects}">
        <div class='project-page-grid' id="p_#{project.id}">
          <div class='project-page-grid-info build-status-${project.build_status}'>
            <span class="project-build-status"/>
            <a href="#{contextPath}/projects/view/#{projectList.project_id}/#{project.name}" title="#{project.name}">
              <span class="project-page-title">#{project.name}</span>
            </a>
          </div>
        </div>
    </h:list>
</ui:composition>
