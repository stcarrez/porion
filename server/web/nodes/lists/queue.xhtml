<ui:composition
  xmlns:awa="http://code.google.com/p/ada-awa/jsf"
  xmlns:ui="http://java.sun.com/jsf/facelets"
  xmlns:f="http://java.sun.com/jsf/core"
  xmlns:fn="http://java.sun.com/jsp/jstl/functions"
  xmlns:c="http://java.sun.com/jstl/core"
  xmlns:u="http://code.google.com/p/ada-asf/util"
  xmlns:w="http://code.google.com/p/ada-asf/widget"
  xmlns:h="http://java.sun.com/jsf/html">
  <div class='queue-list'>
    <div class='awa-list-header queue-list-header'>
      <div class='awa-header-col queue-order'>
	Order
      </div>
      <div class='awa-header-col queue-name'>
        Hostname
      </div>
      <div class='awa-header-col queue-recipe'>
        Recipe
      </div>
      <div class='awa-header-col queue-branch-tag'>
        Tag
      </div>
      <div class="awa-header-col queue-date">
	Date
      </div>
    </div>

    <div class='awa-list'>
      <h:list var="recipe" value="#{queueList.queue}">
	<div class="awa-list-item queued-recipe#{recipe.building ? ' queue-building' : ''}#{recipe.main_recipe ? ' queue-main' : ''}">
	  <div class='queue-order'>
	    #{recipe.order}
	  </div>
          <div class='queue-name'>
            <a href="#{contextPath}/nodes/view/#{recipe.node_name}/summary" title="Build node #{recipe.node_name}">
              #{recipe.node_name}
            </a>
          </div>
          <div class='queue-recipe'>
            <a href="#{contextPath}/projects/view/#{recipe.project_name}/summary" title="Project #{recipe.project_name}">
              #{recipe.project_name}##{recipe.branch_name}~#{recipe.recipe_name}
	    </a>
          </div>
          <div class='queue-branch-tag'>
            #{fn:substring(recipe.branch_tag, 0, 8)}
          </div>
          <div class='queue-date'>
            #{recipe.creation_date}
          </div>
	</div>
      </h:list>
    </div>
  </div>
</ui:composition>
