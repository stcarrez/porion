<ui:composition xmlns:h="http://java.sun.com/jsf/html"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:util="http://code.google.com/p/ada-asf/util"
                xmlns:c="http://java.sun.com/jstl/core"
                template="/WEB-INF/layouts/layout.xhtml">
  <ui:param name="title" value="#{layoutMsg.homePageTitle}" />
  <ui:param name="pageStyle" value="page-build"/>
  <!-- Main page body -->
  <ui:define name="pageBody">
    <f:metadata>
      <f:viewAction action='#{project.load}'/>
    </f:metadata>
    <div id='awa-content'>
      <ui:include src="views/info.xhtml"/>
      <ui:include src="lists/recipes.xhtml"/>
     </div>
  </ui:define>

  <ui:define name="pageScript">
    <script type="text/javascript" src="#{contextPath}/js/jquery.canvaswrapper.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.colorhelpers.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.flot.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.flot.saturated.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.flot.browser.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.flot.drawSeries.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.flot.uiConstants.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.flot.symbol.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.flot.legend.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.flot.time.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.flot.stack.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/jquery.flot.pie.js"></script>
    <script type="text/javascript" src="#{contextPath}/js/projects.js"></script>
  </ui:define>

</ui:composition>
